# Canonical experiment for the day-ahead positioning study.
#
# This file *is* the selected configuration. `run_name` matches the run notebook
# 01's tournament actually lands on and writes into
# artifacts/da_positioning/best_run.json, so the config, the manifest, the saved
# artifacts and notebooks 02-03 all name the same thing.
#
# There is deliberately only one. The previous example shipped top-5/£2 while the
# winning run was top-10/£5 and the notebook prose described a third rule, so no
# reader could tell which numbers belonged to which settings.
strategy: "da_positioning"
strategy_type: "virtual"
run_name: "s4_n5_t30_vm00_tc10"

data:
  periods:
    - start: "2018-01-01"
      end:   "2019-01-01"
      demand_source: NESO_API
  wind_source:            ELEXON    # ELEXON | CSV
  generation_source:      ELEXON    # ELEXON | CSV
  day_ahead_price_source: ENTSOE    # ENTSOE | CSV
  market_index_source:    ELEXON    # ELEXON | CSV
  demand_actual_source:   ELEXON    # ELEXON | CSV
  imbalance_source:       ELEXON    # ELEXON | CSV

model:
  type: xgboost
  # Selected on development-fold MAE only (17.607 £/MWh); the same setting also
  # happened to give the best holdout MAE, which is reassuring but was not the
  # criterion.
  hyperparameters:
    n_estimators: 400
    max_depth: 3
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.7

validation:
  type: walk_forward
  train_days: 200
  test_days: 30
  step_days: 30
  # The last 60 market days are cut off before any folding and never enter
  # selection. Hyperparameters, signal settings and execution parameters are all
  # chosen by reading walk-forward results, so the development curve is an
  # artefact of that search however chronological the folds inside it are. The
  # holdout is the only number quoted as out-of-sample.
  holdout_days: 60

signal:
  threshold: 3.0       # floor: minimum edge required to fire, £/MWh
  top_n: 5
  # Gate = execution buffer + max(threshold, vol_multiplier × rolling vol).
  #
  # Set to zero deliberately, and this is a result rather than a default left
  # alone. The volatility term used to be the rolling std of (SBP − SSP), which
  # under GB's single cash-out price is zero in every settlement period — the
  # "adaptive risk gate" never moved. Rebuilt against the quantity that actually
  # risks the position, the cash-out-to-auction gap, it has a median of about
  # £21/MWh. At any multiplier above ~0.25 the gate swallows nearly every
  # signal: at 1.0 the whole 2018 sample fires 26 times. Development Sharpe is
  # maximised at 0.0, so the sweep's answer is that this gate is not worth
  # running on this signal, not that it is switched off by oversight.
  vol_multiplier: 0.0
  vol_window: 336      # rolling std lookback, half-hour periods (336 = 7 days)
  transaction_cost: 1.0  # cost applied per trade (£/MWh of position)

execution:
  # Passive-at-MID share of each position (rest runs the active TP/SL gate).
  #
  # Zero here follows from the archetype below, not from a hedge sweep. With the
  # TP/SL gate off nothing is closed intraday, so there is no passive slice to
  # size: the two settings are one decision, and notebook 01's tournament picked
  # it (imbalance_only, development Sharpe 7.243).
  #
  # Notebook 02 sweeps the hedge ratio *within the gate-on archetype*, which is a
  # different strategy, and there the picture is genuinely two-sided: net PnL
  # falls monotonically with passive share (£33,241 at 0.00 to £16,459 at 1.00)
  # while Sharpe peaks at 0.40 (7.267 against 7.014 at 0.00). That peak is not
  # a reason to move production. It is +0.25 of Sharpe on a 90-day development
  # window — well inside the noise the holdout bootstrap shows — bought with
  # £7,000 of P&L. The earlier claim of a flat 0.00–0.15 band came from a
  # Calmar × Sharpe criterion on a grid that excluded its own endpoints; the
  # sweep now includes them and states one criterion.
  baseline_hedge_ratio: 0.0
  # The TP/SL gate is off (a threshold no reachable price triggers), so every
  # position rides to imbalance cash-out and none is closed intraday. That is
  # what "imbalance_only" means in the selection grid, and it is why the signal
  # hurdle below excludes slippage: nothing here crosses a spread. Turning the
  # gate on is a different strategy and must be selected as one, not switched on
  # afterwards — the pipeline derives the hurdle from these two values, so the
  # gate and the execution model cannot drift apart again.
  take_profit_pct: 999.0
  stop_loss_price_delta: 999.0
  # Bid-ask crossing cost around MID (£/MWh) charged on every intraday-traded
  # MWh in ALL phases (virtual exits and BESS deviations): a conservative
  # spread-to-MID for GB continuous half-hourly products. Note that MID is an
  # index of completed trades, not an executable quote — see docs/ARCHITECTURE.md
  # on why anything priced off it is an idealised execution study.
  slippage: 2.00

bess:
  capacity_mwh: 100.0
  power_mw: 50.0
  charge_efficiency: 0.94
  discharge_efficiency: 0.94
  degradation_cost_per_mwh: 5.00
  initial_soc_pct: 0.50
  min_soc_pct: 0.10
  max_soc_pct: 0.90
  resolution_h: 1.0
  soc_drift_tolerance: 0.05
  target_daily_cycles: 1.5   # max average daily cycling target; null disables the limit
  # Market allocation: share of the battery's power AND of its daily cycle
  # budget the day-ahead auction may commit (1.0 = greedy all-in). The
  # held-back share of both stays free for the intraday stage, avoiding the
  # slippage of unwinding a DA position to chase MID.
  da_commit_fraction: 1.0
  # MID is not observable intraday, so it is proxied from the known cleared DA
  # price plus a configurable basis. The rolling re-optimisation only deviates
  # from the locked DA plan when a trade beats this basis (+ execution + wear):
  margin_buy: 0.0            # MID-vs-DA basis (£/MWh) charged on extra intraday charging (buy)
  margin_sell: 0.0           # MID-vs-DA basis (£/MWh) shaved off extra intraday discharging (sell)
  # The intraday execution-cost buffer is reused from the top-level execution.slippage.
