name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-ml.txt is the superset the suite exercises: it pulls
        # requirements.txt and adds pytest, scikit-learn and xgboost. The old
        # line installed neither pytest nor the model stack, so `pytest -q`
        # failed before collecting anything.
        run: pip install -r requirements-ml.txt flake8 mypy

      - name: Lint
        run: flake8 .

      - name: Type check
        run: mypy .

      - name: Unit tests
        run: pytest -q

